services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plant_data}
      POSTGRES_USER: ${POSTGRES_USER:-plant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plant_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plant} -d ${POSTGRES_DB:-plant_data}"]
      interval: 5s
      timeout: 3s
      retries: 20

  gremlin:
    build: ./gremlin
    ports:
      - "8182:8182"
    volumes:
      - gremlin-data:/opt/gremlin-server/data

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://plant:plant_dev_password@postgres:5432/plant_data}
      GREMLIN_URL: ${GREMLIN_URL:-ws://gremlin:8182/gremlin}
      SEED_PROFILE: ${SEED_PROFILE:-demo}
      SEED_RANDOM: ${SEED_RANDOM:-20260918}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      gremlin:
        condition: service_started

volumes:
  postgres-data:
  gremlin-data:

